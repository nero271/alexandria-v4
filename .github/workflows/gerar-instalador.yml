name: Gerar instalador do ALEXANDRIA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Instalar dependências
        run: npm install
      - name: Verificar tipos (informativo)
        run: npx tsc --noEmit
        continue-on-error: true
      - name: Rodar testes do Rust (informativo)
        run: cargo test
        working-directory: src-tauri
        continue-on-error: true
      - name: Gerar ícones
        run: npx tauri icon app-icon.png
      - name: Montar o instalador
        run: npx tauri build
      - name: Guardar o instalador
        uses: actions/upload-artifact@v4
        with:
          name: ALEXANDRIA-instalador
          path: src-tauri/target/release/bundle/nsis/*.exe
